kind = "api"
previewPath = "/"
title = "NetSleuth"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/health", "/socket.io"]

[services.development]
run = "pnpm exec turbo run dev --filter=@workspace/netsleuth-api"

[services.production]

[services.production.build]
args = ["pnpm", "exec", "turbo", "run", "build", "--filter=@workspace/netsleuth-api..."]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "apps/api/dist/server.js"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/health"

[[services]]
localPort = 3000
name = "Web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/netsleuth-web dev"

[services.production.build]
args = ["pnpm", "exec", "turbo", "run", "build", "--filter=@workspace/netsleuth-web..."]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/netsleuth-web", "start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/login"
