openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/workspaces:
    post:
      operationId: createWorkspace
      security: [{ AccessCookie: [] }]
      summary: Create a workspace and its OWNER membership atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceInput" }
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
    get:
      operationId: getWorkspaces
      security: [{ AccessCookie: [] }]
      summary: List only the authenticated user's workspaces
      responses:
        "200":
          description: Member workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceListResponse" }
        "401": { $ref: "#/components/responses/AuthError" }
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      security: [{ AccessCookie: [] }]
      summary: Get workspace details as a member
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createProject
      security: [{ AccessCookie: [] }]
      summary: Create a project as workspace OWNER or ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
    get:
      operationId: getProjects
      security: [{ AccessCookie: [] }]
      summary: List projects in a workspace the user belongs to
      responses:
        "200":
          description: Workspace projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}:
    get:
      operationId: getProject
      security: [{ AccessCookie: [] }]
      summary: Get a project through its actual workspace membership
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/auth/register:
    post:
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Safe user information; access and refresh JWTs are set only as HTTP-only cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
  /v1/auth/login:
    post:
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Safe user information; JWTs are set only as HTTP-only cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200":
          description: New JWT cookies issued; previous tokens remain valid until expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401": { $ref: "#/components/responses/AuthError" }
  /v1/auth/logout:
    post:
      operationId: logoutUser
      responses:
        "200":
          description: Browser cookies cleared; JWTs are not revoked server-side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - AccessCookie: []
      responses:
        "200":
          description: Safe user fields fetched from PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401": { $ref: "#/components/responses/AuthError" }
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: API liveness
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHealthResponse"
  /health/ready:
    get:
      operationId: getApiReadiness
      tags: [health]
      summary: PostgreSQL readiness
      responses:
        "200":
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiReadinessResponse"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: netsleuth_access
      description: HTTP-only access JWT. Authorization headers are never used.
  responses:
    AuthError:
      description: Validation, authentication, authorization, not-found, or rate-limit error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    CreateWorkspaceInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
    Workspace:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Project:
      type: object
      required: [id, workspaceId, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [workspace]
          properties:
            workspace: { $ref: "#/components/schemas/Workspace" }
    WorkspaceListResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [workspaces]
          properties:
            workspaces:
              type: array
              items: { $ref: "#/components/schemas/Workspace" }
    ProjectResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [project]
          properties:
            project: { $ref: "#/components/schemas/Project" }
    ProjectListResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [projects]
          properties:
            projects:
              type: array
              items: { $ref: "#/components/schemas/Project" }
    RegisterInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          description: At most 72 UTF-8 bytes to avoid bcrypt truncation.
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8 }
    SafeUser:
      type: object
      required: [id, name, email, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthUserResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/SafeUser" }
    AuthSuccessResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
    ApiHealthResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: ok }
    ApiReadinessResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [database]
          properties:
            database: { type: string, const: connected }
    ApiErrorResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, const: false }
        statusCode: { type: integer }
        message: { type: string }
        errors: {}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

