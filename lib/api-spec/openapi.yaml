openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: API liveness
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHealthResponse"
  /health/ready:
    get:
      operationId: getApiReadiness
      tags: [health]
      summary: PostgreSQL readiness
      responses:
        "200":
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiReadinessResponse"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ApiHealthResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: ok }
    ApiReadinessResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [database]
          properties:
            database: { type: string, const: connected }
    ApiErrorResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, const: false }
        statusCode: { type: integer }
        message: { type: string }
        errors: {}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

