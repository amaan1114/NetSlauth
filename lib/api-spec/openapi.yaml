openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/projects/{projectId}/dashboard/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDashboardSummary
      security: [{ AccessCookie: [] }]
      summary: Authorized project counts, latest 8 alerts and first 10 agents
      description: All-time counts. Critical and severity counts include all statuses. Agent status is stored status, not inferred liveness. Event total includes all persisted event types.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummaryResponse" }
        default: { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}/dashboard/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDashboardActivity
      security: [{ AccessCookie: [] }]
      summary: Authorized project event counts by occurrence time
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [1h, 24h, 7d], default: 24h }
      responses:
        "200":
          description: Zero-filled UTC buckets in a half-open time window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardActivityResponse" }
        default: { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}/alerts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getAlerts
      security: [{ AccessCookie: [] }]
      summary: List project alerts as a workspace member
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: severity
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
      responses:
        "200":
          description: Alerts ordered by lastSeenAt descending with stable ID tie-breaking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertListResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}/database-policy:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDatabasePolicy
      security: [{ AccessCookie: [] }]
      summary: Read project database policy as a workspace member
      responses:
        "200":
          description: Current policy, or null when disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabasePolicyResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
    put:
      operationId: updateDatabasePolicy
      security: [{ AccessCookie: [] }]
      summary: Replace or disable database policy as workspace OWNER or ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabasePolicyInput" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabasePolicyResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/ingest/events:
    post:
      operationId: ingestEvents
      security: [{ AgentKey: [] }]
      summary: Persist one event or a batch of up to 100 events from an authenticated agent
      description: |
        Agent identity and project scope come only from X-Agent-Key.
        The whole request is validated before writing. Inserts and heartbeat updates
        are atomic; retries are deduplicated per agent/eventId.
        Only newly inserted heartbeats update agent liveness using the server time.
        Detection runs synchronously after the event transaction commits, for newly inserted events only.
        If detection fails, this returns 500 but events remain persisted. Duplicate retries do not rerun detection.
        Cookies and Authorization headers cannot authenticate this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventIngestionInput" }
      responses:
        "200":
          description: Transaction committed, including all-duplicate retries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestionResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "413": { $ref: "#/components/responses/AuthError" }
        "500": { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}/agents:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: registerAgent
      security: [{ AccessCookie: [] }]
      summary: Register an agent as a project member
      description: Returns the plaintext API key once. Store it securely; it cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Agent registered. Response is Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRegistrationResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
    get:
      operationId: getAgents
      security: [{ AccessCookie: [] }]
      summary: List up to 100 newest agents in an authorized project
      responses:
        "200":
          description: Project agents, including revoked agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentListResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgent
      security: [{ AccessCookie: [] }]
      summary: Fetch agent details as a member of its actual workspace
      responses:
        "200":
          description: Agent details without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/agents/{agentId}/revoke:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: revokeAgent
      security: [{ AccessCookie: [] }]
      summary: Revoke an agent key as a project member
      description: Subsequent agent authentication fails immediately after revocation completes.
      responses:
        "200":
          description: Revoked agent details without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/workspaces:
    post:
      operationId: createWorkspace
      security: [{ AccessCookie: [] }]
      summary: Create a workspace and its OWNER membership atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceInput" }
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
    get:
      operationId: getWorkspaces
      security: [{ AccessCookie: [] }]
      summary: List only the authenticated user's workspaces
      responses:
        "200":
          description: Member workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceListResponse" }
        "401": { $ref: "#/components/responses/AuthError" }
  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      security: [{ AccessCookie: [] }]
      summary: Get workspace details as a member
      responses:
        "200":
          description: Workspace details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createProject
      security: [{ AccessCookie: [] }]
      summary: Create a project as workspace OWNER or ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
    get:
      operationId: getProjects
      security: [{ AccessCookie: [] }]
      summary: List projects in a workspace the user belongs to
      responses:
        "200":
          description: Workspace projects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/projects/{projectId}:
    get:
      operationId: getProject
      security: [{ AccessCookie: [] }]
      summary: Get a project through its actual workspace membership
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /v1/auth/register:
    post:
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Safe user information; access and refresh JWTs are set only as HTTP-only cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
  /v1/auth/login:
    post:
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Safe user information; JWTs are set only as HTTP-only cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      responses:
        "200":
          description: New JWT cookies issued; previous tokens remain valid until expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401": { $ref: "#/components/responses/AuthError" }
  /v1/auth/logout:
    post:
      operationId: logoutUser
      responses:
        "200":
          description: Browser cookies cleared; JWTs are not revoked server-side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      security:
        - AccessCookie: []
      responses:
        "200":
          description: Safe user fields fetched from PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401": { $ref: "#/components/responses/AuthError" }
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: API liveness
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHealthResponse"
  /health/ready:
    get:
      operationId: getApiReadiness
      tags: [health]
      summary: PostgreSQL readiness
      responses:
        "200":
          description: PostgreSQL is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiReadinessResponse"
        "503":
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    AgentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: Agent-only random credential for ingestion. Never use user JWTs or cookies.
    AccessCookie:
      type: apiKey
      in: cookie
      name: netsleuth_access
      description: HTTP-only access JWT. Authorization headers are never used.
  responses:
    AuthError:
      description: Validation, authentication, authorization, not-found, or rate-limit error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    DashboardMetrics:
      type: object
      required: [totalAgents, onlineAgents, offlineAgents, inactiveAgents, totalNetworkEvents, openAlerts, criticalAlerts]
      properties:
        totalAgents: { type: integer }
        onlineAgents: { type: integer }
        offlineAgents: { type: integer }
        inactiveAgents: { type: integer }
        totalNetworkEvents: { type: integer }
        openAlerts: { type: integer }
        criticalAlerts: { type: integer }
    DashboardAlert:
      type: object
      required: [id, projectId, title, severity, status, ruleId, sourceIp, firstSeenAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        ruleId: { type: string }
        sourceIp: { type: [string, "null"] }
        firstSeenAt: { type: string, format: date-time }
    DashboardAgent:
      type: object
      required: [id, projectId, name, status, lastHeartbeatAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ONLINE, OFFLINE, INACTIVE] }
        lastHeartbeatAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    DashboardSeverityCounts:
      type: object
      required: [CRITICAL, HIGH, MEDIUM, LOW]
      properties:
        CRITICAL: { type: integer }
        HIGH: { type: integer }
        MEDIUM: { type: integer }
        LOW: { type: integer }
    DashboardAgentHealth:
      type: object
      required: [items, limit, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardAgent" }
        limit: { type: integer }
        hasMore: { type: boolean }
    DashboardSummary:
      type: object
      required: [projectId, generatedAt, metrics, severityDistribution, recentAlerts, agentHealth]
      properties:
        projectId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        metrics: { $ref: "#/components/schemas/DashboardMetrics" }
        severityDistribution: { $ref: "#/components/schemas/DashboardSeverityCounts" }
        recentAlerts:
          type: array
          items: { $ref: "#/components/schemas/DashboardAlert" }
        agentHealth: { $ref: "#/components/schemas/DashboardAgentHealth" }
    DashboardBucket:
      type: object
      required: [start, network, authentication, heartbeat, service]
      properties:
        start: { type: string, format: date-time }
        network: { type: integer }
        authentication: { type: integer }
        heartbeat: { type: integer }
        service: { type: integer }
    DashboardActivity:
      type: object
      required: [projectId, range, from, to, intervalMinutes, buckets]
      properties:
        projectId: { type: string, format: uuid }
        range: { type: string, enum: [1h, 24h, 7d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        intervalMinutes: { type: integer }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/DashboardBucket" }
    DashboardSummaryResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data: { $ref: "#/components/schemas/DashboardSummary" }
    DashboardActivityResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer }
        message: { type: string }
        data: { $ref: "#/components/schemas/DashboardActivity" }
    DatabaseDestination:
      type: object
      additionalProperties: false
      required: [ip, port, protocol]
      properties:
        ip: { type: string, description: A single IPv4 or IPv6 address }
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [TCP, UDP] }
    DatabasePolicy:
      type: object
      additionalProperties: false
      required: [databasePorts, allowedDestinations]
      properties:
        databasePorts:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: integer, minimum: 1, maximum: 65535 }
        allowedDestinations:
          type: array
          maxItems: 100
          description: Empty list denies all destinations on monitored ports. Allowed ports must be in databasePorts.
          items: { $ref: "#/components/schemas/DatabaseDestination" }
    DatabasePolicyInput:
      type: object
      additionalProperties: false
      required: [databasePolicy]
      properties:
        databasePolicy:
          oneOf:
            - $ref: "#/components/schemas/DatabasePolicy"
            - type: "null"
    DatabasePolicyResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [databasePolicy]
          properties:
            databasePolicy:
              oneOf:
                - $ref: "#/components/schemas/DatabasePolicy"
                - type: "null"
    SecurityAlert:
      type: object
      required: [id, projectId, agentId, title, description, severity, status, ruleId, fingerprint, evidence, firstSeenAt, lastSeenAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        agentId: { type: [string, "null"], format: uuid }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
        ruleId: { type: string }
        fingerprint: { type: string }
        evidence: { type: object, additionalProperties: true }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertPagination:
      type: object
      required: [page, limit, hasMore]
      properties:
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }
    AlertListResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [alerts, pagination]
          properties:
            alerts:
              type: array
              items: { $ref: "#/components/schemas/SecurityAlert" }
            pagination: { $ref: "#/components/schemas/AlertPagination" }
    NetworkEventInput:
      type: object
      additionalProperties: false
      required: [eventId, eventType, sourceIp, destinationIp, protocol, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: Agent-generated UUID, normalized to lowercase for deduplication.
        eventType:
          type: string
          enum: [NETWORK_CONNECTION_ATTEMPT, NETWORK_CONNECTION_ESTABLISHED, AUTHENTICATION_FAILURE, AUTHENTICATION_SUCCESS, SERVICE_DISCOVERED, AGENT_HEARTBEAT]
        sourceIp:
          type: string
          description: A single IPv4 or IPv6 address, without a CIDR suffix.
        sourcePort: { type: integer, minimum: 0, maximum: 65535 }
        destinationIp:
          type: string
          description: A single IPv4 or IPv6 address, without a CIDR suffix.
        destinationPort: { type: integer, minimum: 0, maximum: 65535 }
        protocol: { type: string, enum: [TCP, UDP, OTHER] }
        metadata:
          type: object
          additionalProperties: true
          description: Optional JSON metadata only. Do not include raw packets, payloads, or credentials.
        occurredAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp with Z or an explicit timezone offset.
    EventIngestionInput:
      oneOf:
        - $ref: "#/components/schemas/NetworkEventInput"
        - type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/NetworkEventInput" }
    EventIngestionResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 200 }
        message: { type: string }
        data:
          type: object
          required: [insertedCount, duplicateCount]
          properties:
            insertedCount: { type: integer, minimum: 0, maximum: 100 }
            duplicateCount: { type: integer, minimum: 0, maximum: 100 }
    AgentInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Agent:
      type: object
      additionalProperties: false
      required: [id, projectId, name, status, lastHeartbeatAt, revokedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ONLINE, OFFLINE, INACTIVE] }
        lastHeartbeatAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentRegistrationResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
        statusCode: { type: integer, const: 201 }
        message: { type: string }
        data:
          type: object
          required: [agent, apiKey]
          properties:
            agent: { $ref: "#/components/schemas/Agent" }
            apiKey: { type: string, description: One-time plaintext credential. Never returned on reads. }
    AgentResponse:
      type: object
      required: [success, statusCode, message, data]
      properties:
        success: { type: boolean, const: true }
